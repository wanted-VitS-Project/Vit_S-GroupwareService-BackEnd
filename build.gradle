plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.group3'
version = '0.0.1-SNAPSHOT'
description = 'VitaminS'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// ── 취약 전이 의존성 상향 ──────────────────────────────────
// springdoc → swagger-core 가 commons-lang3 를 끌고 오는데, Boot 3.5.16 BOM 이 3.17.0 으로 내려 고정한다.
// 3.17.0 은 CVE-2025-48924 영향 범위라 BOM 프로퍼티를 덮어써서 올린다.
// (swagger-core 가 요구하는 버전도 3.20.0 이라 상향이 곧 원래 요구값이다)
ext['commons-lang3.version'] = '3.20.0'

dependencies {
    // --- Web ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // --- Database ---
    // JPA = 애그리거트 단위 쓰기 · MyBatis = 권한 판정/목록 조회.
    // 둘은 같은 DataSource 를 쓰므로 트랜잭션이 공유된다. 트랜잭션 매니저를 따로 만들지 말 것.
    // ⚠️ 같은 트랜잭션에서 JPA 로 쓰고 MyBatis 로 읽으면 flush 전이라 안 보인다. entityManager.flush() 필요.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Flyway ---
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Argon2PasswordEncoder 는 BouncyCastle 의 Argon2BytesGenerator 에 위임한다.
    // 없으면 컴파일은 통과하고 로그인 시점에 NoClassDefFoundError 로 터진다.
    // ⚠️ 버전을 내리지 마라. 1.80 이하는 CVE-2026-0636 영향 범위다 (Mend 스캔에서 검출).
    //    2026-08-03 기준 최신 릴리스.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'

    // --- 세션 ---
    // 인증 방식 = 서버측 세션 + HttpOnly 쿠키 (.ai/api/auth.md).
    // JWT 를 쓰지 않는 이유: 매 요청 Redis 를 조회해야 하는 요구(권한 즉시 반영·강제 로그아웃)라
    // 무상태 이점이 성립하지 않는다. 판단 근거는 .ai/local/STATE.md `🔐 인증·보안 확정값` 참고.
    // ⚠️ spring-session-jdbc 는 넣지 않는다 — 2종이 동시에 있으면 store-type 이 모호해지고
    //    jdbc 가 잡히면 SPRING_SESSION 테이블이 없어 기동에 실패한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'

    // --- Mail ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // --- AWS ---
    implementation platform('software.amazon.awssdk:bom:2.50.2')
    // S3Presigner(프론트에 돌려줄 presigned URL 발급용)도 이 모듈 안에 포함돼 있다 — 별도 아티팩트 없음.
    implementation 'software.amazon.awssdk:s3'
    // --- PDF (미리보기 페이지 수 추출 · 미리보기 5p 절단) ---
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'

    // --- 이미지 처리 ---
    // 이미지 블록: S3 업로드 전 큰 이미지를 리사이즈한다 (원본 화질 유지하며 용량만 절약).
    implementation 'net.coobird:thumbnailator:0.4.20'

    // --- 엑셀 (사원 일괄 등록: 템플릿 생성 · 업로드 파싱, employee.md §6~§8) ---
    // Spring Boot BOM 이 관리하지 않아 버전을 명시한다. poi-ooxml 이 poi(.xls)·xmlbeans 를 함께 끌어와
    // WorkbookFactory 로 .xlsx·.xls 를 모두 읽는다.
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // --- API Docs ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- Validation ---
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Dev ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 트랜잭션 경계(REQUIRES_NEW·롤백)는 목으로 검증할 수 없다. 실제 DB 가 있어야 한다.
    // ⚠️ MySQL 전용 마이그레이션은 H2 에서 돌지 않는다. 트랜잭션 테스트는 Flyway 를 끄고
    //    ddl-auto=create-drop 으로 엔티티에서 스키마를 만든다 (LoginFailureTransactionTest).
    testRuntimeOnly 'com.h2database:h2'
}

// 개인 로컬 설정이 배포 jar 에 실려 나가지 않게 막는다.
// ⚠️ processResources 에서 빼면 안 된다 — bootRun 이 같은 출력물을 클래스패스로 쓰므로
//    로컬 실행이 통째로 깨진다. **jar 를 만들 때만** 제외한다.
tasks.named('bootJar') {
    exclude 'application-local.yml'
}

tasks.named('test') {
    useJUnitPlatform {
        // 벤치마크는 수 분이 걸리고 하드웨어마다 결과가 달라 CI 게이트로 쓸 수 없다.
        // 아래 benchmark 태스크로만 돌린다.
        excludeTags 'benchmark'
    }
    // 테스트가 끝나면 커버리지 리포트를 자동 생성한다.
    // 덕분에 ./gradlew build 한 번으로 리포트까지 만들어진다.
    finalizedBy tasks.named('jacocoTestReport')
}

// ── 성능 실측 (수동) ──────────────────────────────────────
// Argon2 파라미터·세마포어 permit 을 배포 대상 하드웨어에서 직접 재기 위한 태스크.
// 노트북 결과는 참고용이고, 확정값은 t3.medium 에서 잰 값으로 정한다.
//   ./gradlew benchmark
tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Argon2 파라미터 실측 (CI 제외 · 수동 실행)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // 운영 힙(t3.medium · 약 2.1GB)과 맞춘다. 기본값(머신 RAM 의 1/4)으로 재면 수치가 의미 없다.
    maxHeapSize = '2g'
    // ⚠️ Test 태스크라 기본적으로 JaCoCo 에이전트가 붙는다. 계측 비용이 측정값에 섞이면
    //    Argon2 파라미터를 실측하는 목적 자체가 무너진다.
    jacoco {
        enabled = false
    }
    testLogging {
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }   // 매번 다시 잰다
}

// ── 테스트 커버리지 (JaCoCo) ──────────────────────────────
// 리포트 위치: build/reports/jacoco/test/
//   html/index.html          — 사람이 보는 용도
//   jacocoTestReport.xml     — CI 가 읽어 PR 에 코멘트를 다는 용도
//
// ⚠️ 커버리지 %는 품질 지표가 아니다. 100% 여도 assert 없는 껍데기 테스트일 수 있다.
//    현재 임계값(violationRules)은 걸지 않는다. 숫자를 채우려고 의미 없는 테스트를
//    쓰게 되는 부작용이 더 크기 때문이다. 테스트가 쌓인 뒤 팀 합의로 도입한다.
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true     // CI 액션이 이 파일을 읽는다. 끄지 말 것.
        html.required = true
        csv.required = false
    }
    // 커버리지 대상에서 제외할 것 — 로직이 없어 측정 의미가 없다.
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/VitaminSApplication.class',   // 부트 진입점
                        '**/config/**',                   // 설정 클래스
                        '**/dto/**',                      // 데이터 전달 객체
                ])
            })
    )
}
