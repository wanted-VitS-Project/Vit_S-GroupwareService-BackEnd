plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.group3'
version = '0.0.1-SNAPSHOT'
description = 'VitaminS'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Web ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WebFlux 는 WebClient 용도. web 과 함께 있으면 앱은 서블릿(MVC)으로 기동된다.
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // --- Persistence ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Flyway ---
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // --- Session ---
    // ⚠️ Redis / JDBC 두 저장소가 함께 있으면 기동 시 spring.session.store-type 명시 필요.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.session:spring-session-jdbc'

    // --- Mail ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // --- API 문서 (Swagger UI) ---
    // ⚠️ 3.0.x 는 Spring Boot 4 용이다. Boot 3.5.x 에서는 2.8.x 를 쓴다.
    //    운영 프로필에서는 반드시 비활성화할 것 (application-prod.yaml)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- Dev ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
