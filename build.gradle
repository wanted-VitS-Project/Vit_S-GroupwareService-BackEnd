plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.group3'
version = '0.0.1-SNAPSHOT'
description = 'VitaminS'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Web ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // --- Database ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Flyway ---
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // --- Session ---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.session:spring-session-jdbc'

    // --- Mail ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // --- AWS ---
    implementation platform('software.amazon.awssdk:bom:2.50.2')
    implementation 'software.amazon.awssdk:s3'

    // --- API Docs ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- Validation ---
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Dev ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트가 끝나면 커버리지 리포트를 자동 생성한다.
    // 덕분에 ./gradlew build 한 번으로 리포트까지 만들어진다.
    finalizedBy tasks.named('jacocoTestReport')
}

// ── 테스트 커버리지 (JaCoCo) ──────────────────────────────
// 리포트 위치: build/reports/jacoco/test/
//   html/index.html          — 사람이 보는 용도
//   jacocoTestReport.xml     — CI 가 읽어 PR 에 코멘트를 다는 용도
//
// ⚠️ 커버리지 %는 품질 지표가 아니다. 100% 여도 assert 없는 껍데기 테스트일 수 있다.
//    현재 임계값(violationRules)은 걸지 않는다. 숫자를 채우려고 의미 없는 테스트를
//    쓰게 되는 부작용이 더 크기 때문이다. 테스트가 쌓인 뒤 팀 합의로 도입한다.
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true     // CI 액션이 이 파일을 읽는다. 끄지 말 것.
        html.required = true
        csv.required = false
    }
    // 커버리지 대상에서 제외할 것 — 로직이 없어 측정 의미가 없다.
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/VitaminSApplication.class',   // 부트 진입점
                        '**/config/**',                   // 설정 클래스
                        '**/dto/**',                      // 데이터 전달 객체
                ])
            })
    )
}
