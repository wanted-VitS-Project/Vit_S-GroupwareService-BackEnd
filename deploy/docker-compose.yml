# ② VitaminS Spring + Redis(세션·동거) — EC2 /opt/spring 에서 기동
# 값 주입: 같은 폴더의 .env (compose 가 자동 로드 → ${...} 인터폴레이션 + spring env_file)
services:
  spring:
    image: ${ECR_REGISTRY}/team05/backend:latest
    container_name: vitamins-spring
    restart: unless-stopped
    depends_on:
      - redis
    env_file: .env                 # DB/Redis/Mail/S3/정산 등 런타임 값 전부
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vitamins-redis
    restart: unless-stopped
    # 🚨 --notify-keyspace-events Egx 필수.
    #    application.yml 의 session.redis.repository-type=indexed 가 keyspace 알림을 요구한다.
    #    빠지면 단일세션(maximumSessions=1)·계정잠금/role변경 즉시무효화가 "조용히" 안 먹는다
    #    (기동·로그인은 정상이라 안 터지고 안 보인다).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--notify-keyspace-events", "Egx"]
    # 6379 노출 — 파이썬 워커 박스(다른 호스트)가 스트림 소비하려면 필요.
    #   보안: SG 인바운드 6379 는 파이썬 SG(sg-0cfe...) 에서만 허용 + requirepass 이중 방어.
    #   ⚠️ PUBLIC 레포라 사설IP 를 여기 박지 않는다 → 0.0.0.0 바인딩, 접근 제한은 SG 가 담당.
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 모니터링 exporter (Prometheus 스크레이프: node :9100, cAdvisor :8081) ──
  #   접근 제한: 이 박스 SG 인바운드 9100·8081 은 모니터링 SG 에서만 허용.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    # privileged 대신 최소 권한: /dev/kmsg 만 부여(비privileged 로 컨테이너 메트릭 수집 확인됨)
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
