version: 2

updates:
  # GitHub Actions 를 커밋 SHA 로 고정해두면 수동 갱신이 번거롭다.
  # Dependabot 이 새 버전을 SHA 로 바꿔 PR 을 올려준다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - infra
      - chore

  # Gradle 의존성 보안/버전 업데이트.
  # ⚠️ 마이너 이상 업데이트는 Spring Boot 4 계열을 끌어올 수 있으므로
  #    3.5.x 를 유지하려면 PR 내용을 반드시 확인할 것.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels:
      - chore
    ignore:
      # Spring Boot 는 3.5.x 유지. 메이저 업그레이드는 팀 합의 사항이다.
      - dependency-name: org.springframework.boot
        update-types:
          - version-update:semver-major
