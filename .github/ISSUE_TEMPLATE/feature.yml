name: ⭐ Feature
description: 새로운 기능 구현·추가
title: "[Feat] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **이 레포는 PUBLIC 입니다.** 비밀번호·API 키·IP·엔드포인트 등 민감 정보를 작성하지 마세요.

  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 무엇을 구현할지 간단히 작성해주세요.
      placeholder: 예) 이메일 인증 코드 발송 기능을 구현합니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 어떤 패키지·클래스에서 작업할 예정인지 작성해주세요.
      value: |
        - `com.group3.vitamins.`:
        - `com.group3.vitamins.`:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료되었다고 판단할 수 있는 구체적인 조건을 작성해주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 💬 공유 사항
      description: 리뷰어가 알아야 할 내용이나 참고 자료가 있다면 작성해주세요.
      placeholder: 없으면 비워두세요.
    validations:
      required: false
