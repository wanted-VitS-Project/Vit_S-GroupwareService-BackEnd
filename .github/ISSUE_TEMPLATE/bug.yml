name: 🐛 Bug
description: 오류·버그·예외 신고
title: "[Fix] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **이 레포는 PUBLIC 입니다.** 로그를 붙일 때 비밀번호·토큰·IP·엔드포인트가 포함되지 않았는지 확인해주세요.

  - type: input
    id: location
    attributes:
      label: 문제 지점
      description: 버그가 발생한 위치를 작성해주세요.
      placeholder: 예) com.group3.vitamins.auth.LoginService
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 상황에서 어떤 문제가 발생하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 순서대로 작성해주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 에러 로그 / 스크린샷
      description: 있다면 첨부해주세요. **민감 정보는 마스킹**해주세요.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 발생 위치를 작성했습니다.
          required: true
        - label: 재현 방법을 순서대로 작성했습니다.
          required: true
        - label: 다른 팀원의 기능과 관련된 문제인지 확인했습니다.
          required: false
        - label: 첨부한 로그에 민감 정보가 없는지 확인했습니다.
          required: true
