name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다 (러너 낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 테스트 결과를 체크로 발행하고 실패한 라인에 코멘트를 달기 위해 필요하다.
  checks: write
  pull-requests: write

# ⚠️ 액션은 태그가 아니라 커밋 SHA 로 고정한다.
#    @v7 같은 태그는 소유자가 다른 커밋으로 옮길 수 있어 공급망 위험이 있다.
#    버전 갱신은 .github/dependabot.yml 이 PR 로 올려준다.
jobs:
  build:
    name: 빌드 & 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout 은 기본적으로 GITHUB_TOKEN 을 .git/config 에 남긴다.
          # 이후 Gradle 빌드에서 외부 플러그인·의존성 코드가 실행되므로
          # 토큰이 남아 있을 이유가 없다. 이 워크플로우는 git 인증이 필요 없다.
          persist-credentials: false

      - name: JDK 17 설정
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: 빌드 & 테스트
        run: ./gradlew build --no-daemon

      # 어떤 테스트가 왜 깨졌는지 PR 에서 바로 보이게 한다.
      # 아티팩트를 내려받아 열어보지 않아도 되고, 실패한 라인에 코멘트가 달린다.
      # if: always() — 테스트가 실패해도 리포트는 발행해야 하므로.
      - name: 테스트 결과 발행
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: build/test-results/test/TEST-*.xml
          check_name: 테스트 결과
          detailed_summary: true
          include_passed: false
          # 테스트가 하나도 없을 때 CI 를 실패시키지 않는다.
          # 초기에는 테스트가 거의 없으므로 이 옵션이 없으면 계속 빨간불이 뜬다.
          fail_on_failure: false
          require_tests: false

      # 커버리지 변화를 PR 코멘트로 보여준다.
      # ⚠️ min-coverage 를 0 으로 둔 것은 의도적이다. 지금은 **정보 제공용**이며
      #    커버리지 미달로 머지를 막지 않는다. 숫자를 채우려고 의미 없는 테스트를
      #    쓰게 되는 부작용이 더 크기 때문. 테스트가 쌓이면 팀 합의로 임계값을 올린다.
      #
      # ⚠️ continue-on-error: 현재 측정 대상 클래스가 거의 없어 리포트가 비어 있다.
      #    빈 리포트에서 액션이 실패해도 CI 전체를 막지 않도록 한다.
      #    도메인 코드가 쌓이면 이 옵션을 제거할 것.
      - name: 커버리지 리포트
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 📊 테스트 커버리지
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          update-comment: true

      # 실패했을 때만 리포트를 남긴다. 성공 시에는 저장소 용량만 차지한다.
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
