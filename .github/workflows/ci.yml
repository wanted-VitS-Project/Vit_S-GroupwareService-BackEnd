name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다 (러너 낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 & 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 & 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때만 리포트를 남긴다. 성공 시에는 저장소 용량만 차지한다.
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
