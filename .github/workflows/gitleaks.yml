name: Gitleaks

on:
  pull_request:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, main]
  schedule:
    # 매주 월요일 09:00 KST (= 00:00 UTC) 전체 히스토리 정기 스캔
    - cron: '0 0 * * 1'

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 공식 액션(gitleaks/gitleaks-action)은 조직 레포에 라이선스 키를 요구한다.
  # gitleaks CLI 자체는 MIT 라이선스라 바이너리를 직접 받아 쓰면 키가 필요 없다.
  GITLEAKS_VERSION: 8.30.1
  # 릴리스의 gitleaks_<ver>_checksums.txt 에 있는 값.
  # 버전을 올릴 때 이 값도 반드시 함께 갱신할 것.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: 시크릿 스캔
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        # 태그는 이동할 수 있으므로 커밋 SHA 로 고정한다 (공급망 위험 차단)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 커밋 히스토리 전체를 봐야 과거에 섞여 들어간 시크릿을 찾는다
          fetch-depth: 0
          # 스캔에 git 인증이 필요 없다. 토큰을 .git/config 에 남기지 않는다.
          persist-credentials: false

      - name: gitleaks 설치
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # 러너→GitHub 릴리스 CDN 사이 일시적 연결 끊김(curl exit 56 등)을 자동 재시도한다.
          # 체크섬 검증은 그대로라 재시도가 검증 없이 통과시키는 경로를 만들지 않는다.
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"

          # ⚠️ 검증 없이 풀어서 실행하면 변조된 tarball 이 CI 권한으로 실행될 수 있다.
          #    체크섬이 맞을 때만 압축을 해제한다.
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum --check --strict -

          # 시스템 경로(/usr/local/bin) 대신 러너 임시 디렉토리에 설치한다.
          # 러너 이미지 변경이나 권한 설정에 덜 흔들린다.
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${TARBALL}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: gitleaks 버전 확인
        run: gitleaks version

      - name: 스캔
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ⚠️ PR 은 그 PR 이 실제로 바꾼 커밋(base..head)만 스캔한다.
          #    전체 히스토리를 스캔하면 과거·타 브랜치에 섞인 오탐(데모 시드 등)까지 PR 을 막아,
          #    자기 변경과 무관한 실패로 머지가 멈춘다. 전체 히스토리 스캔은 아래가 담당한다:
          #      · push(develop·main) · merge_group · 매주 월요일 스케줄
          #    → PR 은 자기 변경만, 나머지 이벤트는 히스토리 전체.
          if [ "${IS_PR}" = "true" ]; then
            gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --log-opts="${PR_BASE}..${PR_HEAD}" \
              --report-format sarif \
              --report-path gitleaks-report.sarif
          else
            gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --report-format sarif \
              --report-path gitleaks-report.sarif
          fi

      - name: 리포트 업로드 (탐지 시)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7
