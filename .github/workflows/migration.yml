name: Migration

# Flyway 마이그레이션이 실제 MySQL 에서 도는지 검증한다.
#
# 왜 필요한가:
#   마이그레이션 SQL 오류는 앱을 띄우는 시점에야 드러난다. 배포 중에 발견하면 이미 늦다.
#   PR 단계에서 실제 DB 에 적용해보면 문법 오류·순서 문제·중복 버전을 미리 잡는다.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/main/resources/db/migration/**'
      - 'build.gradle'
      - 'src/main/resources/application*.yml'
      - '.github/workflows/migration.yml'
  push:
    branches: [develop, main]
    paths:
      - 'src/main/resources/db/migration/**'

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    name: 마이그레이션 검증
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # CI 전용 일회성 컨테이너다. 외부에 노출되지 않으며 실행 후 폐기된다.
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: vitamins_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 마이그레이션 버전 중복 검사
        run: |
          set -euo pipefail
          DIR=src/main/resources/db/migration
          # V<버전>__<설명>.sql 에서 버전만 추출해 중복이 있는지 본다.
          # 같은 버전이 둘이면 Flyway 가 기동 시점에 실패한다.
          dup=$(ls "$DIR" | sed -n 's/^V\([0-9._]*\)__.*\.sql$/\1/p' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "❌ 중복된 마이그레이션 버전: $dup"
            exit 1
          fi
          echo "✅ 버전 중복 없음"
          ls -1 "$DIR"

      - name: MySQL 준비 대기
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pci-root-password --silent 2>/dev/null; then
              echo "✅ MySQL 준비 완료 (${i}s)"; exit 0
            fi
            sleep 1
          done
          echo "❌ MySQL 기동 실패"; exit 1

      # build.gradle 에는 flyway-core 라이브러리만 있고 Flyway **Gradle 플러그인**은 없다.
      # 따라서 ./gradlew flywayMigrate 는 존재하지 않는다.
      # 앱 빌드 없이 Flyway CLI 로 직접 적용한다 — 더 빠르고 빌드 상태와 무관하게 검증된다.
      - name: 마이그레이션 적용 (Flyway CLI)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/vitamins_ci?useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root \
            -password=ci-root-password \
            -connectRetries=10 \
            -locations=filesystem:/flyway/sql \
            migrate

      - name: 적용 결과 확인
        run: |
          echo "── 생성된 테이블 ──"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-password vitamins_ci \
            -e "SHOW TABLES;"
          echo "── flyway_schema_history ──"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-password vitamins_ci \
            -e "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;"
