name: Deploy Spring (② EC2)

# 이전 team05 배포 파이프라인 이식판(인프라 재사용).
#   OIDC 키리스 → 러너가 GitHub Secrets/Variables 로 .env 조립 → S3(SSE) → SSM → compose.
# ⚠️ PUBLIC 레포다. 계정ID·ARN·버킷명을 여기 박지 않는다 — 전부 vars/secrets 로 뺐다.

on:
  workflow_dispatch:
  push:
    branches: [main]              # develop→main 머지(=릴리스) 시 배포
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-spring-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPO: team05/backend                    # 기존 team05 ECR repo 재사용(이전 프로젝트 폐기 → :latest 덮어씀). OIDC push 권한 검증됨
  S3_PREFIX: ${{ vars.S3_DEPLOY_PREFIX }}     # 예: s3://<bucket>/vitamins/spring/  (버킷명에 계정ID → vars)
  EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG }}      # 예: team05-01-backend (A안: 같은 박스 재사용)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write             # OIDC 토큰 발급(키리스 핵심)
      contents: read
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # arn:aws:iam::<acct>:role/team05-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: 이미지 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO:$TAG" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"
          docker push "$REGISTRY/$ECR_REPO:latest"

      - name: .env 조립 (GitHub Secrets/Variables → 파일)
        # 시크릿을 SSM 명령 텍스트에 넣지 않기 위해 러너에서 파일로 만들어 S3 로만 전달
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SPRING_PROFILES_ACTIVE: prod              # ⚠️ prod 고정 — Swagger 차단
          # DB
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Redis
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SESSION_TIMEOUT: ${{ vars.SESSION_TIMEOUT }}
          # Mail
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # CORS / 링크
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          APP_LOGIN_URL: ${{ vars.APP_LOGIN_URL }}
          # AWS S3 (인증은 인스턴스 role, 여기엔 리전·버킷명만)
          AWS_REGION: ${{ env.AWS_REGION }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          # 정산
          SETTLEMENT_ACCOUNT_ENC_KEY: ${{ secrets.SETTLEMENT_ACCOUNT_ENC_KEY }}
          # Vitamate / 나라장터 (선택)
          VITAMATE_WORKER_TOKEN: ${{ secrets.VITAMATE_WORKER_TOKEN }}
          NARA_API_BASE_URL: ${{ vars.NARA_API_BASE_URL }}
          NARA_API_SERVICE_KEY: ${{ secrets.NARA_API_SERVICE_KEY }}
          # 입찰 수집 워커 (Redis Stream 소비 · 파이썬 워커와 토큰 공유)
          BIDDING_WORKER_TOKEN: ${{ secrets.BIDDING_WORKER_TOKEN }}
          BIDDING_COLLECTION_WORKER_ENABLED: ${{ vars.BIDDING_COLLECTION_WORKER_ENABLED }}
        run: |
          set -euo pipefail
          umask 077
          # ── 필수 값 가드(재발방지) ──
          # 누락 시 앱이 application.yml 기본값(localhost 등)으로 "조용히" 떨어져 런타임에만 깨진다.
          # → 배포 자체를 여기서 실패시켜 잘못된 기동을 막는다.
          missing=""
          for k in DB_URL DB_USERNAME DB_PASSWORD REDIS_HOST REDIS_PASSWORD \
                   MAIL_USERNAME MAIL_PASSWORD CORS_ALLOWED_ORIGINS APP_LOGIN_URL \
                   S3_BUCKET_NAME SETTLEMENT_ACCOUNT_ENC_KEY; do
            [ -z "${!k:-}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "❌ 필수 GitHub Secret/Variable 누락:$missing"
            echo "   → 레포 Settings → Secrets and variables → Actions 에 등록 후 재실행."
            exit 1
          fi
          # ── 경고만 하는 선택 키 ──
          # 배포는 성공하는데 기능만 "조용히" 죽는 값들. 특히
          # BIDDING_COLLECTION_WORKER_ENABLED 는 @ConditionalOnProperty 게이트라
          # 없으면 RedisCollectionRunJobConsumer 빈이 아예 등록되지 않는다
          # (에러도 로그도 없이 입찰 수집 스트림 소비만 안 돈다).
          for k in BIDDING_COLLECTION_WORKER_ENABLED BIDDING_WORKER_TOKEN \
                   VITAMATE_WORKER_TOKEN NARA_API_BASE_URL NARA_API_SERVICE_KEY; do
            [ -z "${!k:-}" ] && echo "⚠️ 미설정: $k — 관련 기능이 조용히 비활성화된다"
          done || true

          : > deploy.env
          # 빈 값은 건너뜀 → application.yml 기본값 유지 (빈값 override 방지)
          for k in ECR_REGISTRY SPRING_PROFILES_ACTIVE \
                   DB_URL DB_USERNAME DB_PASSWORD \
                   REDIS_HOST REDIS_PORT REDIS_PASSWORD SESSION_TIMEOUT \
                   MAIL_USERNAME MAIL_PASSWORD \
                   CORS_ALLOWED_ORIGINS APP_LOGIN_URL \
                   AWS_REGION S3_BUCKET_NAME \
                   SETTLEMENT_ACCOUNT_ENC_KEY \
                   VITAMATE_WORKER_TOKEN NARA_API_BASE_URL NARA_API_SERVICE_KEY \
                   BIDDING_WORKER_TOKEN BIDDING_COLLECTION_WORKER_ENABLED; do
            v="${!k:-}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> deploy.env
          done

      - name: 배포자산 + .env S3 업로드 (SSE)
        run: |
          set -euo pipefail
          aws s3 sync deploy/ "$S3_PREFIX" --exclude '.env.example'
          aws s3 cp deploy.env "${S3_PREFIX}.env" --sse AES256

      - name: ② EC2에서 받아 기동 (SSM send-command — 시크릿 없음)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          echo "대상 인스턴스: $INSTANCE_ID"
          if [ -z "$INSTANCE_ID" ]; then echo "running 인스턴스 없음"; exit 1; fi

          # EC2 명령: S3에서 .env·compose 받기 → ECR 로그인 → compose pull/up → 기동확인
          # (ECR 레지스트리 URL 은 비밀 아님. 실제 시크릿은 S3 의 .env 에만)
          # ⚠️ 기동확인은 "HTTP 응답 존재"로 판정한다(actuator 미도입 — 인증 없이 200 주는 엔드포인트가 없음).
          #    actuator 도입 후 /actuator/health 200 엄밀검증 + Prometheus 연동으로 강화 예정(백로그).
          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "ts() { TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST'; }",
            "export ECR_REGISTRY=$REGISTRY",
            "echo \"[\$(ts)] === 배포 시작 (EC2) ===\"",
            "mkdir -p /opt/spring",
            "aws s3 sync $S3_PREFIX /opt/spring --delete --exclude 'secrets/*'",
            "cd /opt/spring",
            "chmod 600 .env 2>/dev/null || true",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "docker compose pull",
            "docker compose up -d --remove-orphans",
            "echo \"[\$(ts)] 기동 확인: localhost:8080 HTTP 응답 대기...\"",
            "for i in \$(seq 1 40); do code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true); [ -n \"\$code\" ] && [ \"\$code\" != \"000\" ] && { echo \"[\$(ts)] OK: 앱 응답(HTTP \$code)\"; break; }; [ \$i -eq 40 ] && { echo \"[\$(ts)] FAIL: 200초 후에도 무응답\"; docker compose logs --tail 80 spring; exit 1; }; sleep 5; done",
            "docker image prune -f",
            "echo \"[\$(ts)] === 배포 완료 (EC2) ===\""
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy vitamins ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "===== EC2 표준 출력 ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "최종 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "===== EC2 표준 에러 ====="
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: S3 시크릿 정리 (at-rest 제거)
        if: always()
        run: |
          aws s3 rm "${S3_PREFIX}.env" || true
