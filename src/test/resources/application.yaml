# 테스트 전용 설정. src/main/resources/application.yaml 을 덮어쓴다.
#
# 목적: DB·Redis 가 아직 연결되지 않은 상태에서도 테스트가 통과하도록
#       인프라 의존 자동설정을 제외한다.
#
# ⚠️ 임시 조치다. 클라우드 DB 연결 후에는 제외 목록을 걷어내고
#    실제 테스트용 DB 설정(H2 또는 Testcontainers)으로 대체할 것.
#    지금 상태의 contextLoads() 는 영속성·세션 계층을 검증하지 않는다.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
