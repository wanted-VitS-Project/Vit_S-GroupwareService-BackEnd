spring:
  profiles:
    active: local
  application:
    name: VitaminS
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 🚨 DB 세션 타임존을 앱과 맞춘다. 안 맞추면 **같은 행에 시간대가 두 개 섞인다.**
      #    · created_at·updated_at → DB 가 CURRENT_TIMESTAMP 로 채운다 (서버 타임존)
      #    · last_login_at·locked_until → 앱이 LocalDateTime(KST) 으로 채운다
      #    RDS 파라미터가 UTC 라 실제로 9시간 어긋난 값이 한 행에 들어갔다 (2026-08-03 확인).
      #    DATETIME 은 타임존을 저장하지 않으므로 나중에 어느 쪽이 KST 인지 구분할 수 없다.
      #    ⚠️ 앱 밖(DataGrip·수동 SQL)에서 넣는 행은 여전히 서버 타임존을 따른다.
      #       근본 해결은 RDS 파라미터그룹의 time_zone 을 Asia/Seoul 로 바꾸는 것이다 (INFRA 작업).
      connection-init-sql: "SET time_zone = '+09:00'"

  jpa:
    # 스키마의 주인은 Flyway 다. Hibernate 가 손대지 않게 못 박는다.
    hibernate:
      ddl-auto: validate
    # true 면 뷰 렌더링까지 커넥션을 쥐고 있는다. Argon2 처럼 느린 작업이 있으면 커넥션이 금방 마른다.
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ── 세션 (Spring Session · Redis) ──────────────────────
  # 인증 방식이 서버측 세션이므로 세션 저장소가 곧 인증 저장소다.
  #
  # ⚠️ `store-type` 을 쓰지 마라. Boot 3 에서 **삭제된 프로퍼티**라 적어도 조용히 무시된다
  #    (2026-08-04 확인 — spring-boot-autoconfigure 3.5.16 메타데이터에 없음).
  #    저장소는 **클래스패스로 자동 판별**된다.
  # 🚨 그래서 실제 안전장치는 build.gradle 이다 — `spring-session-jdbc` 를 넣지 않는 것.
  #    2종이 동시에 있으면 어느 쪽이 잡힐지 설정으로 못 정한다.
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:4h}     # 유휴 기준 슬라이딩. 요청이 있으면 갱신된다
    redis:
      # ⚠️ indexed 여야 사용자별 세션 조회가 된다. 여기에 두 기능이 달려 있다:
      #    ① 단일 세션(maximumSessions=1)  ② role 변경·계정 잠금 시 즉시 무효화
      #    기본값 default 로 두면 SecurityConfig 의 sessionRegistry 빈 생성이 실패한다.
      # 🚨 indexed 는 Redis 키스페이스 알림(notify-keyspace-events Egx)을 요구한다.
      #    ElastiCache 는 파라미터 그룹에서 켜야 한다 — INFRA 작업 항목.
      repository-type: indexed
      namespace: vitamins:session

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false

  # ── 메일 (SMTP) ─────────────────────────────────────────
  # 관리자 비밀번호 재설정 시 임시 비밀번호를 사원 이메일로 발송한다 (.ai/api/account.md §3).
  # smtp 구조는 공통 고정값(공개 안전), 계정/비번만 환경 종속 — 코드봄바 방식과 동일.
  # 🚨 PUBLIC 레포다. 계정·앱 비밀번호는 여기 쓰지 않는다 — env 또는 application-local.yml(gitignore)로만.
  #    Gmail 은 MAIL_PASSWORD 가 계정 비밀번호가 아니라 "앱 비밀번호" 여야 한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # ⚠️ spring.mail.properties 는 Map<String,String> 이라, 점이 포함된 JavaMail 키는
    #    "[...]" 로 감싸 통째로 키가 되게 한다. 안 감싸면 mail.smtp.* 가 아닌 다른 키로 평탄화될 수 있다.
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      # 발송 지연이 요청을 오래 붙잡지 않게 타임아웃을 건다. 초과하면 MAIL_SEND_FAILED 로 집계된다.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true                      # JS 가 못 읽는다 (XSS 로 세션 탈취 불가)
        secure: ${COOKIE_SECURE:false}       # 운영은 true. HTTPS 에서만 전송
        same-site: lax                       # 🚨 CSRF 방어의 근거. none 으로 바꾸면 CSRF 토큰이 필요하다
        path: /
  # 프록시(ALB/nginx) 뒤에서 원래 스킴·호스트를 인식한다. Secure 쿠키 판정에 필요하다.
  forward-headers-strategy: framework

# ── 비밀번호 해시 ────────────────────────────────────────
# 2026-08-03 실측 기반 잠정값. 근거·실측표는 .ai/local/STATE.md `🔐 인증·보안 확정값` 참고.
# ⚠️ EC2(t3.medium) 에서 `./gradlew benchmark` 를 다시 돌려 iterations·permits 를 최종 확정할 것.
security:
  argon2:
    memory-kb: ${ARGON2_MEMORY_KB:65536}        # 64MB — GPU 방어의 본체. 속도가 필요하면 iterations 를 내린다
    iterations: ${ARGON2_ITERATIONS:3}
    parallelism: ${ARGON2_PARALLELISM:1}        # BouncyCastle 은 lane 을 스레드로 돌리지 않는다. 올려도 안 빨라진다
    salt-length: 16
    hash-length: 32
    permits: ${ARGON2_PERMITS:2}                # 동시 해시 상한. 힙 = permits × memory-kb × 2.5
    login-wait: ${ARGON2_LOGIN_WAIT:8s}
    bulk-wait: ${ARGON2_BULK_WAIT:30s}          # 계정 일괄 발급처럼 요청 1건이 해시 N회를 도는 경로

  # ── 로그인 보호 (.ai/api/auth.md §5-4) ──────────────────
  login:
    lock-threshold: ${LOGIN_LOCK_THRESHOLD:5}         # 연속 실패 횟수
    lock-duration: ${LOGIN_LOCK_DURATION:10m}
    # ⚠️ 인원(30명)의 2배. 사무실이 NAT 하나를 공유해 아침 피크에 한 IP 에서 30회가 넘게 나온다
    ip-rate-limit-per-minute: ${LOGIN_IP_RATE_LIMIT:60}

# ── MyBatis ──────────────────────────────────────────────
# 쓰기는 JPA, 권한 판정·목록 조회는 MyBatis. 같은 DataSource 라 트랜잭션은 공유된다.
# ⚠️ 같은 트랜잭션에서 JPA 로 쓰고 MyBatis 로 읽으면 flush 전이라 안 보인다 — entityManager.flush() 필요.
mybatis:
  # SQL 은 XML 에 둔다 (@Select 등 애노테이션 금지 — 팀 MyBatis 컨벤션).
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ── CORS ─────────────────────────────────────────────────
# allowCredentials=true 라 "*" 를 쓸 수 없다. 오리진을 명시해야 한다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME}

# ── 계정 관리 ────────────────────────────────────────────
# 비밀번호 재설정 메일 링크. 발신 주소(from)는 SMTP 로그인 계정을 그대로 쓴다 (Gmail 이 발신자를 계정으로 강제).
account:
  mail:
    login-url: ${APP_LOGIN_URL:http://localhost:3000/login}
