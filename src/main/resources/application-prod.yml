# 운영 프로필 설정.
# 활성화: SPRING_PROFILES_ACTIVE=prod
#
# ⚠️ 이 파일에는 실제 접속 정보를 적지 않는다. 이 레포는 PUBLIC 이다.
#    DB/Redis 주소·비밀번호는 환경변수(${...})로 주입한다. (GitHub Secrets → 배포 환경변수)

# --- API 문서 비활성화 ---
# Swagger UI 는 API 전체 구조를 그대로 노출한다. 운영에서는 반드시 닫는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
