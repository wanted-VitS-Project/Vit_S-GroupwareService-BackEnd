spring:
  application:
    name: VitaminS

# --- API 문서 (springdoc-openapi) ---
# ⚠️ 운영 프로필에서는 비활성화한다. application-prod.yaml 참고.
#    Swagger UI 는 API 전체 구조를 노출하므로 외부에 열려 있으면 안 된다.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha          # 태그(도메인) 이름순 정렬
    operations-sorter: method   # 메서드순 정렬
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  # 문서화 대상 경로. 내부/운영 엔드포인트가 생기면 여기서 제외한다.
  paths-to-match: /api/**
